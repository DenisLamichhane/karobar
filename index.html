<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // BUILT-IN SVG ICONS
    // ==========================================

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

    const AlertCircle = ({ className }) => <IconWrapper className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></IconWrapper>;
    const Sparkles = ({ className }) => <IconWrapper className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></IconWrapper>;
    const ArrowRight = ({ className }) => <IconWrapper className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconWrapper>;
    const Copy = ({ className }) => <IconWrapper className={className}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></IconWrapper>;
    const Check = ({ className }) => <IconWrapper className={className}><path d="M20 6 9 17l-5-5"/></IconWrapper>;
    const RefreshCw = ({ className }) => <IconWrapper className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconWrapper>;
    const User = ({ className }) => <IconWrapper className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconWrapper>;
    const CreditCard = ({ className }) => <IconWrapper className={className}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></IconWrapper>;
    const PackageCheck = ({ className }) => <IconWrapper className={className}><path d="m16 16 2 2 4-4"/><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="m7.5 4.27 9 5.15"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/></IconWrapper>;
    const XCircle = ({ className }) => <IconWrapper className={className}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></IconWrapper>;
    const Award = ({ className }) => <IconWrapper className={className}><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></IconWrapper>;
    const QrCode = ({ className }) => <IconWrapper className={className}><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></IconWrapper>;
    const LogOut = ({ className }) => <IconWrapper className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></IconWrapper>;
    const Settings = ({ className }) => <IconWrapper className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></IconWrapper>;
    const Mail = ({ className }) => <IconWrapper className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></IconWrapper>;
    const KeyRound = ({ className }) => <IconWrapper className={className}><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5"/></IconWrapper>;
    const UserPlus = ({ className }) => <IconWrapper className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></IconWrapper>;
    const LogIn = ({ className }) => <IconWrapper className={className}><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></IconWrapper>;

    const RobuxIcon = ({ className = 'w-5 h-5' }) => (
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
        <path d="M12 2L20.6603 7V17L12 22L3.33975 17V7L12 2Z" stroke="currentColor" strokeWidth="2.2" fill="currentColor" fillOpacity="0.18" />
        <path d="M12 6L17.1962 9V15L12 18L6.80385 15V9L12 6Z" stroke="currentColor" strokeWidth="1.8" />
        <rect x="10" y="10" width="4" height="4" rx="0.8" fill="currentColor" />
      </svg>
    );

    // ==========================================
    // PRICING & CONVERSION FORMULAS
    // ==========================================
    const calculateNprFromRobux = (robux) => {
      const r = Number(robux);
      if (isNaN(r) || r <= 0) return 0;
      if (r <= 50) return 200;
      if (r < 100) return Math.round(200 + (r - 50) * 3);
      return Math.round(r * 3.5);
    };

    const calculateRobuxFromNpr = (npr) => {
      const n = Number(npr);
      if (isNaN(n) || n < 200) return 0;
      if (n < 350) return Math.floor(50 + (n - 200) / 3);
      return Math.floor(n / 3.5);
    };

    const ESEWA_QR_PAYLOAD = '{"eSewa_id":"9768704220","name":"***** Lamichhane"}';
    const DEFAULT_ESEWA_QR_URL = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&ecc=M&data=${encodeURIComponent(ESEWA_QR_PAYLOAD)}`;

    const hashPassword = (email, password) => {
      const raw = `${email.toLowerCase().trim()}::${password}::rk_salt_2026`;
      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        const chr = raw.charCodeAt(i);
        hash = (hash << 5) - hash + chr;
        hash |= 0;
      }
      return 'rk_hash_' + Math.abs(hash).toString(36) + '_' + btoa(encodeURIComponent(password)).slice(0, 12);
    };

    const compressImageToBase64 = (file, maxWidth = 800, quality = 0.65) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    function App() {
      // Customer Account State
      const [customerAccount, setCustomerAccount] = useState(() => {
        try {
          const saved = localStorage.getItem('rk_customer_session');
          return saved ? JSON.parse(saved) : null;
        } catch {
          return null;
        }
      });
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authConfirmPassword, setAuthConfirmPassword] = useState('');
      const [authRobloxUser, setAuthRobloxUser] = useState('');
      const [authError, setAuthError] = useState('');
      const [isAuthSubmitting, setIsAuthSubmitting] = useState(false);

      // Navigation & Secret Admin Access State
      const [activeTab, setActiveTab] = useState('shop');
      const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
      const [adminPinInput, setAdminPinInput] = useState('');
      const [adminPinError, setAdminPinError] = useState('');
      const [secretClickCount, setSecretClickCount] = useState(0);

      // Server Data States
      const [orders, setOrders] = useState([]);
      const [reviews, setReviews] = useState([]);
      const [shopSettings, setShopSettings] = useState({
        qrImageUrl: '',
        paymentNote: 'Write your Roblox Username in Remarks!',
        adminPin: ''
      });

      // Calculator & Order States
      const [calcNpr, setCalcNpr] = useState('350');
      const [calcRobux, setCalcRobux] = useState('100');
      const [robloxUsername, setRobloxUsername] = useState('');
      const [usernameVerified, setUsernameVerified] = useState(false);
      const [orderRobux, setOrderRobux] = useState(100);
      const [transactionRef, setTransactionRef] = useState('');
      const [proofBase64, setProofBase64] = useState('');
      const [proofFileName, setProofFileName] = useState('');
      const [agreedToTerms, setAgreedToTerms] = useState(true);
      const [isSubmittingOrder, setIsSubmittingOrder] = useState(false);
      const [orderFormError, setOrderFormError] = useState('');
      const [orderSuccessToast, setOrderSuccessToast] = useState('');

      // Live Tracker & Review States
      const [trackedOrderId, setTrackedOrderId] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [copiedId, setCopiedId] = useState(false);
      const [reviewRating, setReviewRating] = useState(5);
      const [reviewComment, setReviewComment] = useState('');
      const [reviewUsername, setReviewUsername] = useState('');
      const [isSubmittingReview, setIsSubmittingReview] = useState(false);
      const [reviewSubmittedMsg, setReviewSubmittedMsg] = useState('');

      // Seller Portal States
      const [adminFilter, setAdminFilter] = useState('ALL');
      const [previewProofModal, setPreviewProofModal] = useState(null);
      const [savingSettings, setSavingSettings] = useState(false);
      const [settingsSavedMsg, setSettingsSavedMsg] = useState('');

      const orderSectionRef = useRef(null);
      const trackerSectionRef = useRef(null);

      // Secret Seller Portal Access
      useEffect(() => {
        const checkUrlForAdmin = () => {
          if (
            window.location.hash === '#admin' ||
            window.location.hash === '#seller' ||
            window.location.search.includes('admin')
          ) {
            setActiveTab('admin');
          }
        };
        checkUrlForAdmin();
        window.addEventListener('hashchange', checkUrlForAdmin);

        const handleKeyDown = (e) => {
          if (
            (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) ||
            (e.altKey && (e.key === 'a' || e.key === 'A'))
          ) {
            e.preventDefault();
            setActiveTab('admin');
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('hashchange', checkUrlForAdmin);
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, []);

      const handleLogoSecretClick = () => {
        setSecretClickCount((prev) => {
          const next = prev + 1;
          if (next >= 5) {
            setActiveTab('admin');
            return 0;
          }
          return next;
        });
      };

      // Poll Node.js Backend Every 2 Seconds
      const fetchServerState = async () => {
        try {
          const res = await fetch('/api/state');
          if (!res.ok) return;
          const data = await res.json();
          if (data.orders) setOrders(data.orders);
          if (data.reviews) setReviews(data.reviews);
          if (data.settings) {
            setShopSettings((prev) => ({
              ...prev,
              qrImageUrl: data.settings.qrImageUrl || prev.qrImageUrl,
              paymentNote: data.settings.paymentNote || prev.paymentNote
            }));
          }
        } catch (err) {
          console.error('Sync error:', err);
        }
      };

      useEffect(() => {
        fetchServerState();
        const interval = setInterval(fetchServerState, 2000);
        return () => clearInterval(interval);
      }, []);

      // Customer Auth Submit
      const isValidEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());

      const handleCustomerAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanEmail = authEmail.trim().toLowerCase();
        if (!isValidEmail(cleanEmail)) {
          setAuthError('Please enter a valid email address.');
          return;
        }
        if (!authPassword || authPassword.length < 6) {
          setAuthError('Password must be at least 6 characters long.');
          return;
        }
        if (authMode === 'signup' && authPassword !== authConfirmPassword) {
          setAuthError('Passwords do not match.');
          return;
        }

        setIsAuthSubmitting(true);
        try {
          const passwordHash = hashPassword(cleanEmail, authPassword);
          const res = await fetch('/api/accounts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              mode: authMode,
              email: cleanEmail,
              passwordHash,
              defaultRobloxUsername: authRobloxUser.trim()
            })
          });
          const data = await res.json();
          if (!res.ok) {
            setAuthError(data.error || 'Authentication failed.');
          } else {
            const sessionData = {
              email: data.account.email,
              defaultRobloxUsername: data.account.defaultRobloxUsername || ''
            };
            setCustomerAccount(sessionData);
            localStorage.setItem('rk_customer_session', JSON.stringify(sessionData));
            if (sessionData.defaultRobloxUsername && !robloxUsername) {
              setRobloxUsername(sessionData.defaultRobloxUsername);
              setUsernameVerified(sessionData.defaultRobloxUsername.length >= 3);
            }
            setShowAuthModal(false);
            setAuthPassword('');
            setAuthConfirmPassword('');
          }
        } catch (err) {
          setAuthError('Server connection error.');
        } finally {
          setIsAuthSubmitting(false);
        }
      };

      const handleCustomerLogout = () => {
        setCustomerAccount(null);
        setTrackedOrderId('');
        setSearchQuery('');
        localStorage.removeItem('rk_customer_session');
      };

      // Calculator Handlers
      const handleCalcNprChange = (val) => {
        setCalcNpr(val);
        const num = Number(val);
        if (!val || isNaN(num) || num < 200) setCalcRobux(0);
        else setCalcRobux(calculateRobuxFromNpr(num));
      };

      const handleCalcRobuxChange = (val) => {
        setCalcRobux(val);
        const num = Number(val);
        if (!val || isNaN(num) || num <= 0) setCalcNpr(0);
        else setCalcNpr(calculateNprFromRobux(num));
      };

      const applyCalcToOrder = () => {
        const validRobux = Math.max(50, Math.min(10000, Number(calcRobux) || 50));
        setOrderRobux(validRobux);
        orderSectionRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      const orderNprPrice = useMemo(() => calculateNprFromRobux(orderRobux), [orderRobux]);

      const handleProofUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setOrderFormError('');
        try {
          setProofFileName(file.name);
          const compressed = await compressImageToBase64(file, 800, 0.65);
          setProofBase64(compressed);
        } catch {
          setOrderFormError('Could not process image. Please try another screenshot.');
        }
      };

      const handlePlaceOrder = async (e) => {
        e.preventDefault();
        setOrderFormError('');
        setOrderSuccessToast('');

        if (!customerAccount?.email) {
          setOrderFormError('Please log in or create an account with your email to place and track your order.');
          setShowAuthModal(true);
          return;
        }
        const cleanUsername = robloxUsername.trim();
        if (!cleanUsername || cleanUsername.length < 3) {
          setOrderFormError('Please enter your valid Roblox username (at least 3 characters).');
          return;
        }
        if (orderRobux < 50) {
          setOrderFormError('Minimum order is 50 Robux (Rs. 200).');
          return;
        }
        if (!proofBase64) {
          setOrderFormError('Please attach a screenshot of your eSewa payment proof.');
          return;
        }
        if (!agreedToTerms) {
          setOrderFormError('Please agree to the terms & anti-scam policies before ordering.');
          return;
        }

        setIsSubmittingOrder(true);
        try {
          const res = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              customerEmail: customerAccount.email.toLowerCase(),
              robloxUsername: cleanUsername,
              robuxAmount: Number(orderRobux),
              nprAmount: orderNprPrice,
              transactionRef: transactionRef.trim() || 'Not Provided',
              proofImage: proofBase64
            })
          });
          const data = await res.json();
          if (res.ok && data.order) {
            setTrackedOrderId(data.order.id);
            setReviewUsername(cleanUsername);
            setProofBase64('');
            setProofFileName('');
            setTransactionRef('');
            setOrderSuccessToast(`Order ${data.order.orderCode} submitted successfully!`);
            await fetchServerState();
            setTimeout(() => {
              trackerSectionRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, 250);
          } else {
            setOrderFormError('Failed to submit order.');
          }
        } catch {
          setOrderFormError('Failed to connect to server.');
        } finally {
          setIsSubmittingOrder(false);
        }
      };

      // Order Tracker Filtering
      const myCustomerOrders = useMemo(() => {
        if (!customerAccount?.email) return [];
        const cleanEmail = customerAccount.email.toLowerCase();
        return orders.filter((o) => o.customerEmail && o.customerEmail.toLowerCase() === cleanEmail);
      }, [orders, customerAccount]);

      const currentTrackedOrder = useMemo(() => {
        if (searchQuery.trim()) {
          const q = searchQuery.trim().toLowerCase();
          if (q === '#admin' || q === 'adminportal') {
            setActiveTab('admin');
            setSearchQuery('');
            return null;
          }
        }
        if (!customerAccount?.email) return null;
        if (trackedOrderId) {
          const found = myCustomerOrders.find((o) => o.id === trackedOrderId || o.orderCode === trackedOrderId);
          if (found) return found;
        }
        if (searchQuery.trim()) {
          const q = searchQuery.trim().toLowerCase();
          return (
            myCustomerOrders.find(
              (o) =>
                o.orderCode?.toLowerCase().includes(q) ||
                o.id.toLowerCase() === q ||
                o.robloxUsername?.toLowerCase().includes(q)
            ) || null
          );
        }
        return myCustomerOrders[0] || null;
      }, [myCustomerOrders, trackedOrderId, searchQuery, customerAccount]);

      const getStatusStepIndex = (status) => {
        switch (status) {
          case 'SUBMITTED': return 1;
          case 'CHECKING_PAYMENT': return 2;
          case 'DELIVERING': return 3;
          case 'DELIVERED': return 4;
          case 'REJECTED': return -1;
          default: return 1;
        }
      };

      // Reviews
      const handleAddReview = async (e) => {
        e.preventDefault();
        if (!reviewComment.trim()) return;
        setIsSubmittingReview(true);
        try {
          const writerName = reviewUsername.trim() || currentTrackedOrder?.robloxUsername || 'NepaliBloxPlayer';
          await fetch('/api/reviews', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              robloxUsername: writerName,
              robuxAmount: currentTrackedOrder?.robuxAmount || orderRobux || 100,
              rating: Number(reviewRating),
              comment: reviewComment.trim(),
              orderCode: currentTrackedOrder?.orderCode || 'VERIFIED',
              verifiedOrder: Boolean(currentTrackedOrder?.status === 'DELIVERED'),
              orderId: currentTrackedOrder?.id
            })
          });
          setReviewComment('');
          setReviewSubmittedMsg('Thank you! Your review has been posted.');
          await fetchServerState();
          setTimeout(() => setReviewSubmittedMsg(''), 4000);
        } catch (err) {
          console.error(err);
        } finally {
          setIsSubmittingReview(false);
        }
      };

      // Private Server-Side Seller PIN Verification
      const handleAdminUnlock = async (e) => {
        e.preventDefault();
        setAdminPinError('');
        try {
          const res = await fetch('/api/admin/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: adminPinInput })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setIsAdminUnlocked(true);
            setAdminPinInput('');
            setAdminPinError('');
          } else {
            setAdminPinError('Invalid Seller PIN.');
          }
        } catch {
          setAdminPinError('Could not verify PIN.');
        }
      };

      const handleUpdateOrderStatus = async (orderId, newStatus, customNote = '') => {
        let defaultNote = '';
        if (newStatus === 'CHECKING_PAYMENT') defaultNote = 'Admin is currently verifying your payment screenshot & transaction ID.';
        else if (newStatus === 'DELIVERING') defaultNote = 'Payment verified! Sending your Robux to your account now...';
        else if (newStatus === 'DELIVERED') defaultNote = 'Robux Delivered! Enjoy your Robux and thank you for choosing Robux Karobar!';
        else if (newStatus === 'REJECTED') defaultNote = 'Order issue: Payment proof unclear or invalid. Please contact support.';

        await fetch(`/api/orders/${orderId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus, adminNote: customNote || defaultNote })
        });
        await fetchServerState();
      };

      const handleCustomQrUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const compressed = await compressImageToBase64(file, 600, 0.8);
        setShopSettings((prev) => ({ ...prev, qrImageUrl: compressed }));
      };

      const handleSaveShopSettings = async (e) => {
        e.preventDefault();
        setSavingSettings(true);
        try {
          const payload = {
            qrImageUrl: shopSettings.qrImageUrl,
            paymentNote: shopSettings.paymentNote
          };
          if (shopSettings.adminPin && shopSettings.adminPin.trim().length >= 4) {
            payload.adminPin = shopSettings.adminPin.trim();
          }
          await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setSettingsSavedMsg('Settings updated live!');
          setTimeout(() => setSettingsSavedMsg(''), 3500);
        } finally {
          setSavingSettings(false);
        }
      };

      const filteredAdminOrders = useMemo(() => {
        if (adminFilter === 'ALL') return orders;
        return orders.filter((o) => o.status === adminFilter);
      }, [orders, adminFilter]);

      const pendingOrdersCount = useMemo(
        () => orders.filter((o) => o.status !== 'DELIVERED' && o.status !== 'REJECTED').length,
        [orders]
      );

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans selection:bg-emerald-500 selection:text-slate-950">
          {/* Top Rate Announcement Bar */}
          <div className="bg-gradient-to-r from-emerald-950 via-slate-900 to-emerald-950 border-b border-emerald-500/20 px-4 py-2 text-xs sm:text-sm">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2 font-medium text-emerald-300">
                <Sparkles className="w-4 h-4 text-emerald-400 shrink-0" />
                <span>
                  <strong>Official Nepal Rate:</strong> 100 Robux = Rs. 350 NPR •{' '}
                  <span className="text-amber-300">Minimum Order: 50 Robux (Rs. 200)</span>
                </span>
              </div>
              <div className="flex items-center gap-4 text-slate-300 text-xs">
                <span className="flex items-center gap-1">
                  <ShieldCheck className="w-3.5 h-3.5 text-emerald-400" /> 100% Anti-Scam Verified
                </span>
                <span className="hidden sm:flex items-center gap-1">
                  <Clock className="w-3.5 h-3.5 text-emerald-400" /> Instant Live Status Tracker
                </span>
              </div>
            </div>
          </div>

          {/* Main Navigation Header */}
          <header className="sticky top-0 z-40 backdrop-blur-xl bg-slate-950/85 border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-3">
              <div
                onClick={() => {
                  setActiveTab('shop');
                  handleLogoSecretClick();
                }}
                className="flex items-center gap-3 cursor-pointer group select-none"
              >
                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition-transform">
                  <RobuxIcon className="w-6 h-6 text-slate-950" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl font-extrabold tracking-tight text-white">
                      ROBUX <span className="text-emerald-400">KAROBAR</span>
                    </h1>
                    <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                      NP
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Trusted Nepali Roblox Store</p>
                </div>
              </div>

              <nav className="flex items-center gap-1 sm:gap-2 overflow-x-auto py-1">
                <button
                  onClick={() => setActiveTab('shop')}
                  className={`px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'shop'
                      ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/20'
                      : 'text-slate-300 hover:text-white hover:bg-slate-800/70'
                  }`}
                >
                  <ShoppingCart className="w-4 h-4" />
                  <span>Buy Robux</span>
                </button>

                <button
                  onClick={() => {
                    setActiveTab('shop');
                    setTimeout(() => trackerSectionRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
                  }}
                  className="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800/70 transition-all flex items-center gap-1.5 whitespace-nowrap"
                >
                  <Clock className="w-4 h-4 text-emerald-400" />
                  <span>Track Order</span>
                </button>

                <button
                  onClick={() => setActiveTab('reviews')}
                  className={`px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'reviews'
                      ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/20'
                      : 'text-slate-300 hover:text-white hover:bg-slate-800/70'
                  }`}
                >
                  <Star className="w-4 h-4" />
                  <span>Reviews ({reviews.length + 3})</span>
                </button>

                <button
                  onClick={() => setActiveTab('policies')}
                  className={`px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'policies'
                      ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/20'
                      : 'text-slate-300 hover:text-white hover:bg-slate-800/70'
                  }`}
                >
                  <ShieldCheck className="w-4 h-4" />
                  <span className="hidden md:inline">Terms & Anti-Scam</span>
                  <span className="md:hidden">Terms</span>
                </button>

                {customerAccount ? (
                  <div className="flex items-center gap-1.5 pl-1 sm:pl-2 border-l border-slate-800">
                    <button
                      type="button"
                      onClick={() => {
                        setActiveTab('shop');
                        setTimeout(() => trackerSectionRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
                      }}
                      className="px-3 py-1.5 rounded-lg bg-slate-900 border border-emerald-500/30 text-xs font-bold text-emerald-300 flex items-center gap-1.5 max-w-[160px] truncate"
                    >
                      <User className="w-3.5 h-3.5 text-emerald-400 shrink-0" />
                      <span className="truncate">{customerAccount.email.split('@')[0]}</span>
                      <span className="px-1.5 py-0.2 rounded-full bg-emerald-500/20 text-emerald-300 text-[10px]">
                        {myCustomerOrders.length}
                      </span>
                    </button>
                    <button
                      type="button"
                      onClick={handleCustomerLogout}
                      className="p-2 rounded-lg bg-slate-900 hover:bg-rose-500/15 text-slate-400 hover:text-rose-400 border border-slate-800 transition-all"
                      title="Log Out"
                    >
                      <LogOut className="w-4 h-4" />
                    </button>
                  </div>
                ) : (
                  <button
                    type="button"
                    onClick={() => {
                      setAuthMode('login');
                      setAuthError('');
                      setShowAuthModal(true);
                    }}
                    className="ml-1 px-3.5 py-2 rounded-lg text-xs sm:text-sm font-bold bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-emerald-500/40 transition-all flex items-center gap-1.5 whitespace-nowrap"
                  >
                    <LogIn className="w-4 h-4" />
                    <span>Login / Sign Up</span>
                  </button>
                )}
              </nav>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-12">
            {activeTab === 'shop' && (
              <>
                {/* 1. Calculator */}
                <section className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-slate-900 to-emerald-950/60 border border-emerald-500/30 shadow-2xl p-6 sm:p-8">
                  <div className="max-w-4xl mx-auto">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                      <div>
                        <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 mb-2">
                          <Calculator className="w-3.5 h-3.5" /> INSTANT ROBUX RATE CALCULATOR
                        </span>
                        <h2 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                          Check How Much Robux You Get For Your Rs.
                        </h2>
                        <p className="text-slate-400 text-sm mt-1">
                          Rate: <strong className="text-emerald-400">100 Robux = Rs. 350</strong> • Minimum Order:{' '}
                          <strong className="text-amber-300">50 Robux = Rs. 200</strong>
                        </p>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {[
                          { r: 50, n: 200 },
                          { r: 100, n: 350 },
                          { r: 200, n: 700 },
                          { r: 500, n: 1750 },
                          { r: 1000, n: 3500 }
                        ].map((preset) => (
                          <button
                            key={preset.r}
                            type="button"
                            onClick={() => {
                              setCalcRobux(String(preset.r));
                              setCalcNpr(String(preset.n));
                            }}
                            className="px-2.5 py-1.5 rounded-lg bg-slate-800/90 hover:bg-emerald-500/20 border border-slate-700 text-xs font-semibold text-slate-200 transition-all"
                          >
                            {preset.r} R$ = Rs.{preset.n}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-11 gap-4 items-center">
                      <div className="md:col-span-5 bg-slate-950/90 border border-slate-800 rounded-2xl p-4">
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">
                          You Pay (Nepali Rupees - NPR)
                        </label>
                        <div className="flex items-center gap-3">
                          <span className="text-lg font-extrabold text-amber-400 bg-amber-400/10 px-3 py-1.5 rounded-xl border border-amber-400/20">
                            Rs.
                          </span>
                          <input
                            type="number"
                            min="200"
                            step="10"
                            value={calcNpr}
                            onChange={(e) => handleCalcNprChange(e.target.value)}
                            className="w-full bg-transparent text-2xl font-extrabold text-white focus:outline-none"
                          />
                        </div>
                      </div>

                      <div className="md:col-span-1 flex justify-center">
                        <div className="w-10 h-10 rounded-full bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold">
                          ⇄
                        </div>
                      </div>

                      <div className="md:col-span-5 bg-slate-950/90 border border-slate-800 rounded-2xl p-4">
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">
                          You Receive (Robux Amount)
                        </label>
                        <div className="flex items-center gap-3">
                          <span className="p-2 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-400">
                            <RobuxIcon className="w-5 h-5" />
                          </span>
                          <input
                            type="number"
                            min="50"
                            step="10"
                            value={calcRobux}
                            onChange={(e) => handleCalcRobuxChange(e.target.value)}
                            className="w-full bg-transparent text-2xl font-extrabold text-emerald-400 focus:outline-none"
                          />
                          <span className="text-xs font-bold text-slate-400 uppercase pr-1">R$</span>
                        </div>
                      </div>
                    </div>

                    <div className="mt-5 pt-5 border-t border-slate-800/80 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                      <div className="flex items-start gap-2.5 text-xs sm:text-sm text-slate-300">
                        <ShieldCheck className="w-5 h-5 text-emerald-400 shrink-0 mt-0.5" />
                        <div>
                          <span className="font-semibold text-white">Instant Rate Summary: </span>
                          For <strong className="text-emerald-400">Rs. {calcNpr || 0}</strong>, you will receive{' '}
                          <strong className="text-emerald-400">{calcRobux || 0} Robux</strong>!
                        </div>
                      </div>
                      <button
                        type="button"
                        disabled={Number(calcRobux) < 50}
                        onClick={applyCalcToOrder}
                        className="w-full sm:w-auto px-5 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 disabled:opacity-40 text-slate-950 font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20"
                      >
                        <span>Order {Number(calcRobux) >= 50 ? `${calcRobux} R$ for Rs. ${calcNpr}` : 'Now'}</span>
                        <ArrowRight className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                </section>

                {/* 2. Ordering Form & QR */}
                <section ref={orderSectionRef} className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                  <div className="lg:col-span-7 bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-5 mb-6">
                      <div>
                        <span className="text-xs font-bold uppercase tracking-wider text-emerald-400">
                          FAST & SAFE ROBUX DELIVERY
                        </span>
                        <h3 className="text-2xl font-extrabold text-white mt-0.5">Place Your Robux Order</h3>
                      </div>
                      <div className="px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-right">
                        <span className="block text-[11px] text-slate-400">Total To Pay</span>
                        <span className="text-lg font-extrabold text-emerald-400">Rs. {orderNprPrice}</span>
                      </div>
                    </div>

                    {customerAccount ? (
                      <div className="mb-6 p-3.5 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex flex-wrap items-center justify-between gap-2 text-xs">
                        <div className="flex items-center gap-2 text-emerald-300">
                          <CheckCircle2 className="w-4 h-4 text-emerald-400 shrink-0" />
                          <span>Ordering as <strong className="text-white">{customerAccount.email}</strong></span>
                        </div>
                        <button type="button" onClick={handleCustomerLogout} className="text-slate-400 hover:text-white underline font-semibold">
                          Switch Account
                        </button>
                      </div>
                    ) : (
                      <div className="mb-6 p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div className="flex items-start gap-2.5 text-xs text-amber-200">
                          <Lock className="w-4 h-4 text-amber-400 shrink-0 mt-0.5" />
                          <div>
                            <p className="font-bold text-white">Account Required for Order Privacy</p>
                            <p className="text-slate-300 mt-0.5">Log in or create an account so only you can view your orders.</p>
                          </div>
                        </div>
                        <button
                          type="button"
                          onClick={() => { setAuthMode('login'); setAuthError(''); setShowAuthModal(true); }}
                          className="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-xs shrink-0"
                        >
                          Login / Sign Up
                        </button>
                      </div>
                    )}

                    <form onSubmit={handlePlaceOrder} className="space-y-6">
                      <div className="bg-slate-950/60 border border-slate-800/90 rounded-2xl p-5">
                        <label className="block text-sm font-bold text-white mb-2">1. Your Roblox Username</label>
                        <div className="relative flex items-center">
                          <User className="w-5 h-5 text-slate-500 absolute left-3.5" />
                          <input
                            type="text"
                            required
                            value={robloxUsername}
                            onChange={(e) => {
                              setRobloxUsername(e.target.value);
                              setUsernameVerified(e.target.value.trim().length >= 3);
                            }}
                            placeholder="Enter exact Roblox username"
                            className="w-full pl-11 pr-24 py-3.5 bg-slate-900 border border-slate-700 rounded-xl text-white font-semibold text-sm focus:outline-none"
                          />
                        </div>
                      </div>

                      <div className="bg-slate-950/60 border border-slate-800/90 rounded-2xl p-5">
                        <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                          <label className="text-sm font-bold text-white">2. Select Amount of Robux</label>
                          <div className="flex items-center gap-2">
                            <span className="px-3 py-1 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 font-extrabold text-base">
                              {orderRobux} R$
                            </span>
                            <span className="text-slate-400 font-bold">=</span>
                            <span className="px-3 py-1 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-300 font-extrabold text-base">
                              Rs. {orderNprPrice}
                            </span>
                          </div>
                        </div>
                        <input
                          type="range"
                          min="50"
                          max="5000"
                          step="10"
                          value={orderRobux}
                          onChange={(e) => setOrderRobux(Number(e.target.value))}
                          className="w-full h-2.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-400 my-2"
                        />
                      </div>

                      <div className="bg-slate-950/60 border border-slate-800/90 rounded-2xl p-5 space-y-4">
                        <label className="text-sm font-bold text-white block">3. Attach Payment Proof (Screenshot)</label>
                        <input
                          type="text"
                          value={transactionRef}
                          onChange={(e) => setTransactionRef(e.target.value)}
                          placeholder="Transaction Code / Reference ID (Optional)"
                          className="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm"
                        />
                        <div className="border-2 border-dashed border-slate-700 hover:border-emerald-500/60 rounded-2xl p-5 text-center bg-slate-900/50">
                          <input type="file" id="proof-upload" accept="image/*" onChange={handleProofUpload} className="hidden" />
                          <label htmlFor="proof-upload" className="cursor-pointer flex flex-col items-center justify-center space-y-2">
                            {proofBase64 ? (
                              <div className="space-y-2">
                                <img src={proofBase64} alt="Preview" className="max-h-44 rounded-xl mx-auto border border-emerald-500/40" />
                                <span className="text-xs font-bold text-emerald-400 block">{proofFileName} (Click to change)</span>
                              </div>
                            ) : (
                              <>
                                <Upload className="w-8 h-8 text-emerald-400" />
                                <div className="text-sm font-bold text-white">Click to Upload Payment Screenshot</div>
                                <p className="text-xs text-slate-400">Pay Rs. {orderNprPrice} via eSewa QR and attach receipt.</p>
                              </>
                            )}
                          </label>
                        </div>
                      </div>

                      {orderFormError && (
                        <div className="p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs font-semibold">
                          {orderFormError}
                        </div>
                      )}
                      {orderSuccessToast && (
                        <div className="p-4 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-sm font-bold">
                          {orderSuccessToast}
                        </div>
                      )}

                      <button
                        type="submit"
                        disabled={isSubmittingOrder}
                        className="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-black text-base shadow-xl"
                      >
                        {isSubmittingOrder ? 'Submitting Order...' : `Submit Order (${orderRobux} R$ for Rs. ${orderNprPrice})`}
                      </button>
                    </form>
                  </div>

                  {/* Right Column: Clean eSewa QR Card (Name & Number Removed) */}
                  <div className="lg:col-span-5 space-y-6 lg:sticky lg:top-24">
                    <div className="bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-emerald-500/40 rounded-3xl p-6 shadow-2xl">
                      <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-2">
                          <QrCode className="w-5 h-5 text-emerald-400" />
                          <h4 className="font-extrabold text-white text-lg">Scan & Pay Here</h4>
                        </div>
                        <span className="px-2.5 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-bold">
                          eSewa Official QR
                        </span>
                      </div>

                      <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 mb-5 text-center">
                        <span className="text-xs uppercase font-bold text-slate-400 block">Exact Amount To Pay Now</span>
                        <div className="text-3xl font-black text-emerald-400 mt-0.5">Rs. {orderNprPrice}</div>
                        <span className="text-xs text-slate-400 mt-1 block">For <strong className="text-white">{orderRobux} Robux</strong></span>
                      </div>

                      <div className="bg-[#161e27] border-2 border-slate-700/80 rounded-2xl p-5 flex flex-col items-center justify-center shadow-2xl mx-auto max-w-[280px]">
                        <div className="bg-white rounded-xl p-2.5 shadow-md">
                          <img
                            src={shopSettings.qrImageUrl || DEFAULT_ESEWA_QR_URL}
                            alt="eSewa QR Code"
                            className="w-52 h-52 object-contain rounded-md"
                          />
                        </div>
                        <div className="mt-4 flex items-center justify-center gap-1.5">
                          <div className="w-7 h-7 rounded-full bg-[#60bb46] flex items-center justify-center text-white font-serif font-bold text-lg">e</div>
                          <span className="text-white font-serif text-2xl font-medium">Sewa</span>
                        </div>
                      </div>

                      <div className="mt-5 text-center text-xs bg-slate-950/90 border border-slate-800 rounded-2xl p-3.5">
                        <span className="font-semibold text-amber-300">
                          {shopSettings.paymentNote}
                        </span>
                      </div>
                    </div>
                  </div>
                </section>

                {/* 3. Live Order Status Bar */}
                <section ref={trackerSectionRef} className="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6 mb-6">
                    <div>
                      <span className="text-xs font-bold uppercase text-emerald-400">PRIVATE ACCOUNT ORDER TRACKER</span>
                      <h3 className="text-2xl font-extrabold text-white mt-0.5">Your Live Order & Delivery Status</h3>
                    </div>
                    <div className="w-full md:w-80">
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => { setSearchQuery(e.target.value); setTrackedOrderId(''); }}
                        placeholder="Filter orders by ID or Username..."
                        className="w-full px-4 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white"
                      />
                    </div>
                  </div>

                  {!customerAccount ? (
                    <div className="text-center py-10 space-y-4 bg-slate-950/60 border border-slate-800 rounded-2xl">
                      <Lock className="w-8 h-8 text-emerald-400 mx-auto" />
                      <h4 className="text-base font-extrabold text-white">Log In to See Your Private Orders</h4>
                      <button
                        type="button"
                        onClick={() => { setAuthMode('login'); setAuthError(''); setShowAuthModal(true); }}
                        className="px-5 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs"
                      >
                        Log In / Sign Up
                      </button>
                    </div>
                  ) : currentTrackedOrder ? (
                    <div className="space-y-6">
                      <div className="flex flex-wrap gap-2">
                        {myCustomerOrders.map((ord) => (
                          <button
                            key={ord.id}
                            onClick={() => setTrackedOrderId(ord.id)}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${
                              currentTrackedOrder.id === ord.id
                                ? 'bg-emerald-500 text-slate-950 border-emerald-400'
                                : 'bg-slate-950 text-slate-300 border-slate-800'
                            }`}
                          >
                            {ord.orderCode} • {ord.robuxAmount} R$ ({ord.status})
                          </button>
                        ))}
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                        {[
                          { step: 1, title: '1. Submitted', desc: 'Receipt attached' },
                          { step: 2, title: '2. Checking Payment', desc: 'Verifying eSewa' },
                          { step: 3, title: '3. Delivering', desc: 'Sending Robux' },
                          { step: 4, title: '4. Delivered!', desc: 'Complete' }
                        ].map((item) => {
                          const currentStep = getStatusStepIndex(currentTrackedOrder.status);
                          const isCompleted = currentStep >= item.step;
                          return (
                            <div
                              key={item.step}
                              className={`p-4 rounded-2xl border ${
                                isCompleted ? 'bg-emerald-500/15 border-emerald-400' : 'bg-slate-950/40 border-slate-800 opacity-50'
                              }`}
                            >
                              <div className="font-extrabold text-sm text-white">{item.title}</div>
                              <div className="text-xs text-slate-400 mt-1">{item.desc}</div>
                            </div>
                          );
                        })}
                      </div>

                      <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-xs sm:text-sm text-slate-300">
                        <strong className="text-white">Live Server Update:</strong> {currentTrackedOrder.adminNote}
                      </div>

                      {currentTrackedOrder.status === 'DELIVERED' && !currentTrackedOrder.reviewed && (
                        <form onSubmit={handleAddReview} className="bg-slate-950 border border-emerald-500/40 rounded-2xl p-4 space-y-3">
                          <div className="text-xs font-bold text-emerald-400 uppercase">Leave a Review for Your Order</div>
                          <div className="flex gap-2">
                            <input
                              type="text"
                              required
                              value={reviewComment}
                              onChange={(e) => setReviewComment(e.target.value)}
                              placeholder="How fast was your delivery?"
                              className="flex-1 px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white"
                            />
                            <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs">
                              Post Review
                            </button>
                          </div>
                        </form>
                      )}
                    </div>
                  ) : (
                    <div className="text-center py-8 text-sm text-slate-400">
                      No orders found under {customerAccount.email} yet.
                    </div>
                  )}
                </section>
              </>
            )}

            {/* Reviews Tab */}
            {activeTab === 'reviews' && (
              <section className="max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6">
                <h3 className="text-2xl font-extrabold text-white">Verified Customer Reviews</h3>
                <form onSubmit={handleAddReview} className="space-y-4 border-b border-slate-800 pb-6">
                  <input
                    type="text"
                    required
                    value={reviewUsername}
                    onChange={(e) => setReviewUsername(e.target.value)}
                    placeholder="Your Roblox Username"
                    className="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white"
                  />
                  <textarea
                    rows={2}
                    required
                    value={reviewComment}
                    onChange={(e) => setReviewComment(e.target.value)}
                    placeholder="Write your review..."
                    className="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white"
                  />
                  {reviewSubmittedMsg && <p className="text-xs font-bold text-emerald-400">{reviewSubmittedMsg}</p>}
                  <button type="submit" className="px-6 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs">
                    Submit Review
                  </button>
                </form>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {reviews.map((r) => (
                    <div key={r.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-2">
                      <div className="flex justify-between text-xs">
                        <strong className="text-white">@{r.robloxUsername}</strong>
                        <span className="text-emerald-400 font-bold">{r.robuxAmount} R$</span>
                      </div>
                      <p className="text-xs text-slate-300">"{r.comment}"</p>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* Terms Tab */}
            {activeTab === 'policies' && (
              <section className="max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-4">
                <h2 className="text-2xl font-extrabold text-white">Terms of Service & 100% Anti-Scam Guarantee</h2>
                <p className="text-sm text-slate-300">1. Every order is logged with a unique tracking ID and delivered straight to your Roblox account once your eSewa payment screenshot is verified.</p>
                <p className="text-sm text-slate-300">2. Official Rate: 100 Robux = Rs. 350 (Minimum Order: 50 Robux = Rs. 200).</p>
                <p className="text-sm text-slate-300">3. Submitting fake or edited payment screenshots results in immediate order cancellation.</p>
              </section>
            )}

            {/* Hidden Seller Portal (Private PIN Verified on Server) */}
            {activeTab === 'admin' && (
              <section className="space-y-8">
                {!isAdminUnlocked ? (
                  <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center space-y-5">
                    <Lock className="w-10 h-10 text-amber-400 mx-auto" />
                    <h3 className="text-2xl font-extrabold text-white">Seller Portal Login</h3>
                    <form onSubmit={handleAdminUnlock} className="space-y-4">
                      <input
                        type="password"
                        value={adminPinInput}
                        onChange={(e) => setAdminPinInput(e.target.value)}
                        placeholder="Enter Private Seller PIN"
                        className="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-center text-white"
                      />
                      {adminPinError && <p className="text-xs text-rose-400">{adminPinError}</p>}
                      <button type="submit" className="w-full py-3 rounded-xl bg-amber-400 text-slate-950 font-black text-sm">
                        Unlock Seller Dashboard
                      </button>
                    </form>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-slate-900 border border-amber-500/30 rounded-3xl p-6 flex flex-wrap items-center justify-between gap-4">
                      <div>
                        <h2 className="text-2xl font-extrabold text-white">Seller Order & Delivery Center</h2>
                        <p className="text-xs text-slate-400">Pending Orders: {pendingOrdersCount} | Total: {orders.length}</p>
                      </div>
                      <button
                        onClick={() => { setIsAdminUnlocked(false); setActiveTab('shop'); }}
                        className="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300"
                      >
                        Exit Seller Portal
                      </button>
                    </div>

                    <div className="space-y-4">
                      {filteredAdminOrders.map((order) => (
                        <div key={order.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col lg:flex-row justify-between gap-4">
                          <div className="space-y-1">
                            <div className="flex items-center gap-2">
                              <span className="font-mono font-black text-emerald-400">{order.orderCode}</span>
                              <span className="text-xs bg-slate-800 px-2 py-0.5 rounded text-white">{order.status}</span>
                              <span className="text-xs text-slate-400">{order.customerEmail}</span>
                            </div>
                            <p className="text-sm text-white">
                              Roblox User: <strong>{order.robloxUsername}</strong> • <strong>{order.robuxAmount} R$</strong> (Rs. {order.nprAmount})
                            </p>
                          </div>
                          <div className="flex flex-wrap items-center gap-2">
                            {order.proofImage && (
                              <button
                                onClick={() => setPreviewProofModal(order)}
                                className="px-3 py-2 rounded-xl bg-slate-800 text-xs font-bold text-emerald-300"
                              >
                                View Screenshot
                              </button>
                            )}
                            <button
                              onClick={() => handleUpdateOrderStatus(order.id, 'CHECKING_PAYMENT')}
                              className="px-3 py-2 rounded-xl bg-amber-400/20 text-amber-300 text-xs font-bold"
                            >
                              1. Checking Payment
                            </button>
                            <button
                              onClick={() => handleUpdateOrderStatus(order.id, 'DELIVERING')}
                              className="px-3 py-2 rounded-xl bg-sky-400/20 text-sky-300 text-xs font-bold"
                            >
                              2. Delivering
                            </button>
                            <button
                              onClick={() => handleUpdateOrderStatus(order.id, 'DELIVERED')}
                              className="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black"
                            >
                              3. Deliver Robux ✓
                            </button>
                            <button
                              onClick={() => handleUpdateOrderStatus(order.id, 'REJECTED')}
                              className="px-3 py-2 rounded-xl bg-rose-500/20 text-rose-400 text-xs font-bold"
                            >
                              Reject
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Admin QR & PIN Settings */}
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                      <h3 className="text-lg font-extrabold text-white">QR & Security Settings</h3>
                      <form onSubmit={handleSaveShopSettings} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Upload Custom QR Image</label>
                          <input
                            type="file"
                            accept="image/*"
                            onChange={handleCustomQrUpload}
                            className="w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-emerald-500 file:text-slate-950 file:font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Change Private Seller PIN (Optional)</label>
                          <input
                            type="password"
                            value={shopSettings.adminPin || ''}
                            onChange={(e) => setShopSettings((p) => ({ ...p, adminPin: e.target.value }))}
                            placeholder="Enter new PIN to change"
                            className="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white"
                          />
                        </div>
                        <div className="md:col-span-2 flex justify-between items-center">
                          <span className="text-xs font-bold text-emerald-400">{settingsSavedMsg}</span>
                          <button type="submit" disabled={savingSettings} className="px-5 py-2 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs">
                            {savingSettings ? 'Saving...' : 'Save Settings'}
                          </button>
                        </div>
                      </form>
                    </div>
                  </div>
                )}
              </section>
            )}
          </main>

          {/* Screenshot Preview Modal */}
          {previewProofModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <h4 className="font-extrabold text-white">Payment Proof • {previewProofModal.orderCode}</h4>
                  <button onClick={() => setPreviewProofModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <img src={previewProofModal.proofImage} alt="Proof" className="rounded-xl max-h-[60vh] mx-auto object-contain" />
              </div>
            </div>
          )}

          {/* Customer Login / Signup Modal */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-5">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-extrabold text-white">
                    {authMode === 'login' ? 'Customer Login' : 'Create Customer Account'}
                  </h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-400">✕</button>
                </div>

                <div className="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl">
                  <button
                    type="button"
                    onClick={() => { setAuthMode('login'); setAuthError(''); }}
                    className={`py-2 rounded-lg text-xs font-extrabold ${authMode === 'login' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}
                  >
                    Log In
                  </button>
                  <button
                    type="button"
                    onClick={() => { setAuthMode('signup'); setAuthError(''); }}
                    className={`py-2 rounded-lg text-xs font-extrabold ${authMode === 'signup' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}
                  >
                    Create Account
                  </button>
                </div>

                <form onSubmit={handleCustomerAuthSubmit} className="space-y-4">
                  <input
                    type="email"
                    required
                    value={authEmail}
                    onChange={(e) => setAuthEmail(e.target.value)}
                    placeholder="youremail@gmail.com"
                    className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                  />
                  {authMode === 'signup' && (
                    <input
                      type="text"
                      value={authRobloxUser}
                      onChange={(e) => setAuthRobloxUser(e.target.value)}
                      placeholder="Default Roblox Username (Optional)"
                      className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                    />
                  )}
                  <input
                    type="password"
                    required
                    minLength={6}
                    value={authPassword}
                    onChange={(e) => setAuthPassword(e.target.value)}
                    placeholder="Password (Min 6 chars)"
                    className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                  />
                  {authMode === 'signup' && (
                    <input
                      type="password"
                      required
                      minLength={6}
                      value={authConfirmPassword}
                      onChange={(e) => setAuthConfirmPassword(e.target.value)}
                      placeholder="Confirm Password"
                      className="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                    />
                  )}
                  {authError && <div className="text-xs text-rose-400 font-semibold">{authError}</div>}
                  <button type="submit" disabled={isAuthSubmitting} className="w-full py-3 rounded-xl bg-emerald-500 text-slate-950 font-black text-sm">
                    {isAuthSubmitting ? 'Please wait...' : authMode === 'login' ? 'Log In' : 'Create Account'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
